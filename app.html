<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HelloWorld">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>HelloWorld</title>
</head>
<body>
  <div class="app" id="app" aria-busy="true">
    <header>
      <div class="logo">🌏</div>
      <h1 id="appTitle">HelloWorld</h1>
      <div class="subtitle" id="appSubtitle">언어 데이터를 불러오는 중입니다…</div>
    </header>
    <main>
      <section class="screen" id="basic">
        <div class="section-title"><h2>Basic Phrases</h2><p>기본 표현을 눌러 확인하세요</p></div>
        <div class="basic-accordion" id="basicList"></div>
      </section>
      <section class="screen" id="talk" hidden>
        <div class="section-title"><h2>Let's Talk!</h2><p>주제를 선택해 대화를 시작하세요</p></div>
        <div class="topic-grid" id="topicPicker"></div>
        <div id="talkFlow"></div>
      </section>
      <section class="screen" id="translate" hidden>
        <div class="section-title"><h2>Translate</h2><p>오프라인 문구 검색과 온라인 번역</p></div>
        <div class="translation-box">
          <div class="dir-row">
            <div class="dir-chip" id="dirFrom">🇰🇷 한국어</div>
            <button class="swap-btn" id="swapBtn" type="button" aria-label="번역 방향 바꾸기">⇄</button>
            <div class="dir-chip" id="dirTo"></div>
          </div>
          <textarea class="tr-input" id="srcText" rows="3" maxlength="500" placeholder="번역할 문장을 입력하세요."></textarea>
          <div class="tr-meta"><span>Enter로 번역 · Shift+Enter 줄바꿈</span><span id="charCount">0자</span></div>
          <div class="tr-actions">
            <button class="tr-go" id="translateBtn" type="button">번역하기</button>
            <button class="tr-clear" id="clearBtn" type="button">지우기</button>
          </div>
        </div>
        <div id="trResult"></div>
        <div class="tr-history" id="trHistoryWrap" hidden>
          <div class="tr-history-head"><span>최근 번역</span><button class="tr-history-clear" id="historyClear" type="button">전체 삭제</button></div>
          <div id="trHistory"></div>
        </div>
      </section>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="주요 기능">
    <div class="bottom-nav-inner">
      <button class="nav-btn active" data-tab="basic"><span class="nav-icon">📚</span><span class="nav-label">Basic Phrases</span></button>
      <button class="nav-btn" data-tab="talk"><span class="nav-icon">💬</span><span class="nav-label">Let's Talk!</span></button>
      <button class="nav-btn" data-tab="translate"><span class="nav-icon">🔄</span><span class="nav-label">Translate</span></button>
    </div>
  </nav>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
